name: Auto Renew Openworld VPS

on:
  schedule:
    - cron: '0 2 */2 * *'
  workflow_dispatch:

jobs:
  Renew-openworld:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4.2.2

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            fonts-noto-cjk \
            libgl1 \
            libglib2.0-0

      - name: 🐍 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 🚀 运行 Openworld 续期脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          ACCOUNT_NAME:  ${{ secrets.ACCOUNT_NAME }}
          HEADLESS: "true"
          SCREENSHOT_DIR: "."
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            python3 apprenew.py

      - name: 💾 上传验证码与诊断文件
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: captcha-debug-${{ github.run_number }}
          path: |
            captcha_*.png
            captcha_*.gif
            *.html
            login_*.png
            vps_*.png
            after_renew_*.png
            uncaught_error.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f chromium || true
          pkill -f Xvfb || true
          pkill -f "playwright" || true

      - name: 🧹 清理旧的工作流运行记录（保留最近 30 条）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq 'sort_by(.databaseId) | reverse | .[30:][] | .databaseId' \
          | while read -r run_id; do
              [ -z "$run_id" ] && continue
              echo "🗑️ 删除运行记录: $run_id"
              gh run delete "$run_id" || true
            done
          set -e
