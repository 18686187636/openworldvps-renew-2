name: Auto Renew Openworld VPS

on:
  schedule:
    - cron: '0 2 */2 * *' # 每2天UTC 2点 (北京时间10点),自行调整
  workflow_dispatch:

jobs:
  Renew-openworld:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4.2.2

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk
          pip install playwright requests ddddocr Pillow numpy
          playwright install --with-deps chromium

      - name: 🚀 运行 Openworld 续期脚本
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
          ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }} 
        run: |
          xvfb-run --auto-servernum python3 apprenew.py

      - name: 💾 上传验证码 GIF
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: captcha-gifs
          path: |
            *.gif
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧽 清理进程
        if: always()
        run: |
          pkill -f chromium || true
          pkill -f Xvfb || true

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
